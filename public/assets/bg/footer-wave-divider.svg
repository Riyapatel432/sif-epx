<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 60" width="100%" height="60" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="footer-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22B8F0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E40D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1F6B" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background top transparent to match newsletter band -->
  <path d="M 0,0 L 1440,0 L 1440,25 C 1140,55 860,10 520,38 C 260,55 100,20 0,35 Z" fill="#0B1F6B"/>
  
  <!-- Sleek neon wave accent line -->
  <path d="M 0,35 C 100,20 260,55 520,38 C 860,10 1140,55 1440,25" fill="none" stroke="url(#footer-wave-grad)" stroke-width="2" stroke-linecap="round"/>
</svg>
